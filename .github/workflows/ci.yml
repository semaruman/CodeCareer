name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: codecareer_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Tailwind CSS
        working-directory: CodeCareer
        run: |
          npm ci
          npm run build:css

      - name: Restore
        run: dotnet restore CodeCareer.sln

      - name: Build
        run: dotnet build CodeCareer.sln --no-restore -c Release

      - name: Test
        env:
          ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=codecareer_test;User=root;Password=root;
        run: dotnet test CodeCareer.sln --no-build -c Release --verbosity normal

      - name: Publish
        run: dotnet publish CodeCareer/CodeCareer.csproj -c Release -o ./publish
